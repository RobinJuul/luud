# Builds the release package on a macOS runner.
# - Pushing a tag like v0.1.0 builds, then publishes a GitHub Release with the DMG, zip and checksums.
# - Pushing to a release/* branch (or running it by hand) only builds, and keeps the package
#   as a workflow artifact so it can be tried before tagging.
name: Release

on:
  push:
    tags: ["v*.*.*"]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          echo "SDK $(xcrun --show-sdk-version)"

      - name: Read version
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Info.plist version $version"
            exit 1
          fi

      # Every release is signed with the same "Luud Code Signing" certificate, so macOS treats an
      # update as the same app and keeps its permissions. The certificate lives in repository
      # secrets and is loaded into a throwaway keychain for this run only.
      - name: Signing certificate
        env:
          SIGNING_P12: ${{ secrets.LUUD_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.LUUD_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_P12" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::Releases must be signed: add the LUUD_SIGNING_P12 and LUUD_SIGNING_PASSWORD secrets"
              exit 1
            fi
            echo "::warning::No signing certificate; this build is signed ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"

      - name: Build and package
        run: ./Scripts/package.sh

      - name: Release notes
        run: |
          # The CHANGELOG section for this version, without its heading or the link footer.
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## \[/ { found = index($0, "[" v "]") > 0; next }
            /^\[[^]]+\]: / { next }
            found
          ' CHANGELOG.md > dist/release-notes.md
          if [[ ! -s dist/release-notes.md ]]; then
            echo "::error::No CHANGELOG.md entry for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Luud-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Luud ${{ steps.version.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/Luud-${{ steps.version.outputs.version }}.dmg
            dist/Luud-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS
